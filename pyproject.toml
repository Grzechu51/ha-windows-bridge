[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-windows-bridge"
version = "0.10.0-beta.1"
description = "Connect Windows audio, applications and media sessions to Home Assistant over MQTT"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "comtypes>=1.4,<2",
    "dxcam>=0.3,<0.4",
    "paho-mqtt>=2.1,<3",
    "psutil>=6,<8",
    "pycaw>=20240210",
    "pywin32>=308",
    "qrcode[pil]>=8.2,<9",
    "QtAwesome>=1.4.2,<2",
    "winrt-Windows.Foundation>=3.2.1,<4",
    "winrt-Windows.Foundation.Collections>=3.2.1,<4",
    "winrt-Windows.Media.Control>=3.2.1,<4",
    "winrt-Windows.Storage.Streams>=3.2.1,<4",
    "websocket-client>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "PyInstaller>=6.11,<7",
    "pytest>=9.0.3,<10",
    "ruff>=0.16,<0.17",
    "bandit>=1.9,<2",
    "pip-audit>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/Grzechu51/ha-windows-bridge"
Issues = "https://github.com/Grzechu51/ha-windows-bridge/issues"

[project.scripts]
ha-windows-bridge = "ha_windows_bridge.app:main"

[tool.setuptools.packages.find]
include = ["ha_windows_bridge*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B"]
ignore = ["E501"]

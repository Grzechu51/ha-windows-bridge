show_overlay:
  target:
    entity:
      domain: notify
      integration: ha_windows_bridge
  fields:
    notification_id:
      selector:
        text:
    content:
      collapsed: false
      fields:
        title:
          selector:
            text:
        message:
          selector:
            text:
              multiline: true
        media:
          default: false
          selector:
            boolean:
    appearance:
      collapsed: true
      fields:
        preset:
          selector:
            select:
              options:
                - default
                - success
                - warning
                - error
                - info
        icon:
          selector:
            text:
        layout:
          selector:
            select:
              options:
                - default
                - media
        size:
          selector:
            select:
              options:
                - small
                - medium
                - large
        opacity:
          selector:
            number:
              min: 0.35
              max: 1
              step: 0.05
              mode: slider
        qr:
          selector:
            text:
        image:
          selector:
            text:
              multiline: true
    progress_options:
      collapsed: true
      fields:
        progress:
          selector:
            number:
              min: 0
              max: 100
              mode: slider
        progress_entity:
          selector:
            entity:
              domain:
                - sensor
                - number
                - input_number
        progress_attribute:
          selector:
            text:
        progress_min:
          selector:
            number:
              mode: box
        progress_max:
          selector:
            number:
              mode: box
    timing:
      collapsed: true
      fields:
        duration:
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: s
        duration_entity:
          selector:
            entity:
              domain:
                - sensor
                - number
                - input_number
        duration_attribute:
          selector:
            text:
        pinned:
          default: false
          selector:
            boolean:
    placement:
      collapsed: true
      fields:
        corner:
          selector:
            select:
              options:
                - top_left
                - top_right
                - bottom_left
                - bottom_right
                - top_center
        monitor:
          selector:
            number:
              min: 0
              max: 15
              mode: box

update_overlay:
  target:
    entity:
      domain: notify
      integration: ha_windows_bridge
  fields:
    notification_id:
      required: true
      selector:
        text:
    title:
      selector:
        text:
    message:
      selector:
        text:
          multiline: true
    media:
      selector:
        boolean:
    progress:
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    progress_entity:
      selector:
        entity:
          domain:
            - sensor
            - number
            - input_number
    progress_attribute:
      selector:
        text:
    progress_min:
      selector:
        number:
          mode: box
    progress_max:
      selector:
        number:
          mode: box
    pinned:
      selector:
        boolean:

remove_overlay:
  target:
    entity:
      domain: notify
      integration: ha_windows_bridge
  fields:
    notification_id:
      required: true
      selector:
        text:

clear_overlay:
  target:
    entity:
      domain: notify
      integration: ha_windows_bridge
